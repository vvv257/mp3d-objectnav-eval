[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mp3d-objectnav-eval"
version = "0.1.0"
description = "A lightweight, method-agnostic evaluator for MP3D ObjectNav agents on Habitat-Lab."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.urls]
Repository = "https://github.com/vvv257/mp3d-objectnav-eval"
Issues = "https://github.com/vvv257/mp3d-objectnav-eval/issues"

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
objectnav-eval = "objectnav_eval.cli:main"

[tool.setuptools.packages.find]
include = ["objectnav_eval*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
